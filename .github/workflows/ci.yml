name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-pc-windows-msvc is the target platform (spec/sap_profile.yaml).
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs the channel and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - run: cargo test -p struktal-math --no-default-features --locked
      - name: Verification bench, both backends
        run: |
          cargo build -p struktal-cli --locked
          ./target/debug/struktal verify --backend faer verification/cases/*/case.json --report verify-faer.json
          ./target/debug/struktal verify --backend skyline verification/cases/*/case.json --report verify-skyline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: verify-*.json
          if-no-files-found: ignore

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --locked

  references:
    name: Analytical references are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_cases.py
      - run: python tools/check_cases.py
