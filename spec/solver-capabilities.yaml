# Capacidades reales de cada backend (guía §6). Generado a mano; la fuente de
# verdad ejecutable es `rust-fem capabilities`.
default_backend: faer-sparse-ldlt   # decisión 0005
backends:
  - name: faer-sparse-ldlt
    version: faer 0.24.4 (fijada)
    pure_rust: true
    matrix_classes: [spd]
    unsupported: [symmetric_indefinite, general_unsymmetric, complex]
    pivoting: none (LDLT)
    ordering: AMD (faer)
    scaling: symmetric diagonal 1/sqrt(a_ii)
    singularity: regularización dinámica de faer (eps 1e-10, delta centinela 1e30); pivotes nulos y negativos leídos de D
    nullity_count: pivotes NO revelan el rango (0005); nulidad vía fem_math::nullspace con cotas verificadas (0006)
    psd_regularized_mode: true (signs=+1, eps 1e-8, delta 1e30)
    inertia: signos de D; exacta solo sin pivotes nulos
    multiple_rhs: true
    symbolic_reuse: posible en faer, no usado aún
    memory_estimate_before_factorization: true
    index_types: {csc: u32}
    threads: 1 (Par::Seq)
    determinism: resultados idénticos bit a bit entre ejecuciones (medido)
    measured_limits: docs/benchmarks.md
  - name: skyline-ldlt
    version: 0.1.0
    pure_rust: true
    matrix_classes: [spd]
    unsupported: [symmetric_indefinite, general_unsymmetric, complex]   # -> unsupported_backend
    pivoting: none
    ordering: reverse_cuthill_mckee
    scaling: symmetric diagonal 1/sqrt(a_ii)
    singularity: pivotes escalados |d| <= 1e-10; DOF identificados
    nullity_count: pivotes NO revelan el rango (0005); nulidad vía fem_math::nullspace (0006)
    psd_regularized_mode: true
    inertia: exacta solo sin pivotes nulos (Sylvester)
    multiple_rhs: true (una factorización por modelo)
    symbolic_reuse: false
    memory_estimate_before_factorization: true   # rechaza si excede --memory-budget-mib
    index_types: {csc_rows: u32, profile: usize}
    threads: 1
    measured_limits: docs/benchmarks.md
candidates_pending_evaluation:
  - MUMPS (FFI opcional, indefinidas con pivoteo, inercia) [S11] — necesario para F08-004
  - faer LBLT intranodal: descartado como solver indefinido general (pivoteo solo dentro del supernodo)
