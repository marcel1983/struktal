[workspace]
resolver = "3"
members = ["crates/struktal-core", "crates/struktal-math", "crates/struktal-elements", "crates/struktal-analysis", "crates/struktal-io-s2k", "crates/struktal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
struktal-core = { path = "crates/struktal-core" }
struktal-math = { path = "crates/struktal-math" }
struktal-elements = { path = "crates/struktal-elements" }
struktal-analysis = { path = "crates/struktal-analysis" }
struktal-io-s2k = { path = "crates/struktal-io-s2k" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
